name: HighRoller Final Docker Push

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: lukedmonkey
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build -t lukedmonkey/my-app2:latest .

      - name: Push Docker image
        run: docker push lukedmonkey/my-app2:latest
